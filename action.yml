name: 'Node.js CI/CD Wrapper'
description: 'Automated Node.js setup, build, test, and SAST pipeline for GitHub Actions'
author: 'savindaJ'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  node-version:
    description: 'Node.js version to install (e.g. 20, 22.x)'
    required: false
    default: '20'
  skip-tests:
    description: 'Set to true to skip unit tests'
    required: false
    default: 'false'
  skip-lint:
    description: 'Set to true to skip code linting'
    required: false
    default: 'false'
  skip-sast:
    description: 'Set to true to skip SAST static code analysis'
    required: false
    default: 'false'
  sast-fail-on-findings:
    description: 'Fail the pipeline when SAST finds issues'
    required: false
    default: 'false'
  sast-report-dir:
    description: 'Directory where SAST reports are written'
    required: false
    default: 'sast-reports'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Make scripts executable
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/setup-build.sh"
        chmod +x "${{ github.action_path }}/scripts/sast-summary.sh"

    - name: Run CI/CD pipeline
      shell: bash
      env:
        SAST_FAIL_ON_FINDINGS: ${{ inputs.sast-fail-on-findings }}
        SAST_REPORT_DIR: ${{ inputs.sast-report-dir }}
      run: |
        FLAGS=""
        if [ "${{ inputs.skip-tests }}" = "true" ]; then FLAGS="$FLAGS --skip-tests"; fi
        if [ "${{ inputs.skip-lint }}" = "true" ]; then FLAGS="$FLAGS --skip-lint"; fi
        if [ "${{ inputs.skip-sast }}" = "true" ]; then FLAGS="$FLAGS --skip-sast"; fi

        bash "${{ github.action_path }}/setup-build.sh" $FLAGS

    - name: Publish SAST report to job summary
      if: inputs.skip-sast != 'true'
      shell: bash
      env:
        SAST_REPORT_DIR: ${{ inputs.sast-report-dir }}
      run: bash "${{ github.action_path }}/scripts/sast-summary.sh"

    - name: Upload SAST SARIF to GitHub Security
      if: inputs.skip-sast != 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sast-report-dir }}/semgrep.sarif
        category: semgrep-sast

    - name: Upload SAST report artifact
      if: inputs.skip-sast != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: sast-report
        path: ${{ inputs.sast-report-dir }}/
        if-no-files-found: warn
        retention-days: 30
