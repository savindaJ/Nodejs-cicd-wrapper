name: 'Node.js CI/CD Wrapper'
description: 'Automated Node.js setup, build, test, SAST, and DAST pipeline for GitHub Actions'
author: 'savindaJ'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  pipeline-mode:
    description: 'Pipeline stage — full (build + DAST), build (build only), or dast-only (post-deploy DAST scan)'
    required: false
    default: 'full'
  node-version:
    description: 'Node.js version to install (e.g. 20, 22.x)'
    required: false
    default: '20'
  skip-tests:
    description: 'Set to true to skip unit tests'
    required: false
    default: 'false'
  skip-lint:
    description: 'Set to true to skip code linting'
    required: false
    default: 'false'
  skip-sast:
    description: 'Set to true to skip SAST static code analysis'
    required: false
    default: 'false'
  sast-fail-on-findings:
    description: 'Fail the pipeline when SAST finds issues'
    required: false
    default: 'false'
  sast-fail-on-secrets:
    description: 'Fail the pipeline when hardcoded secrets or sensitive data are detected'
    required: false
    default: 'false'
  sast-report-dir:
    description: 'Directory where SAST reports are written'
    required: false
    default: 'sast-reports'
  skip-dast:
    description: 'Set to true to skip DAST dynamic application security testing'
    required: false
    default: 'false'
  dast-target:
    description: 'URL of the running application to scan with OWASP ZAP (e.g. http://localhost:3000)'
    required: false
    default: ''
  dast-start-command:
    description: 'Optional command to start the application before DAST (runs in background)'
    required: false
    default: ''
  dast-start-wait-seconds:
    description: 'Seconds to wait after starting the application before ZAP scans'
    required: false
    default: '15'
  dast-fail-on-findings:
    description: 'Fail the pipeline when OWASP ZAP finds alerts'
    required: false
    default: 'false'
  dast-report-dir:
    description: 'Directory where DAST reports are written'
    required: false
    default: 'dast-reports'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      if: inputs.pipeline-mode != 'dast-only'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Make scripts executable
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/setup-build.sh"
        chmod +x "${{ github.action_path }}/scripts/sast-summary.sh"
        chmod +x "${{ github.action_path }}/scripts/sensitive-data-summary.sh"
        chmod +x "${{ github.action_path }}/scripts/dast-prepare.sh"
        chmod +x "${{ github.action_path }}/scripts/dast-summary.sh"
        chmod +x "${{ github.action_path }}/scripts/dast-collect.sh"

    - name: Run CI/CD pipeline
      if: inputs.pipeline-mode != 'dast-only'
      shell: bash
      env:
        SAST_FAIL_ON_FINDINGS: ${{ inputs.sast-fail-on-findings }}
        SAST_FAIL_ON_SECRETS: ${{ inputs.sast-fail-on-secrets }}
        SAST_REPORT_DIR: ${{ inputs.sast-report-dir }}
      run: |
        FLAGS=""
        if [ "${{ inputs.skip-tests }}" = "true" ]; then FLAGS="$FLAGS --skip-tests"; fi
        if [ "${{ inputs.skip-lint }}" = "true" ]; then FLAGS="$FLAGS --skip-lint"; fi
        if [ "${{ inputs.skip-sast }}" = "true" ]; then FLAGS="$FLAGS --skip-sast"; fi

        bash "${{ github.action_path }}/setup-build.sh" $FLAGS

    - name: Publish SAST report to job summary
      if: inputs.pipeline-mode != 'dast-only' && inputs.skip-sast != 'true'
      shell: bash
      env:
        SAST_REPORT_DIR: ${{ inputs.sast-report-dir }}
      run: bash "${{ github.action_path }}/scripts/sast-summary.sh"

    - name: Publish sensitive data report to job summary
      if: inputs.pipeline-mode != 'dast-only' && inputs.skip-sast != 'true'
      shell: bash
      env:
        SAST_REPORT_DIR: ${{ inputs.sast-report-dir }}
      run: bash "${{ github.action_path }}/scripts/sensitive-data-summary.sh"

    - name: Upload SAST SARIF to GitHub Security
      if: inputs.pipeline-mode != 'dast-only' && inputs.skip-sast != 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sast-report-dir }}/semgrep.sarif
        category: semgrep-sast

    - name: Upload SAST report artifact
      if: inputs.pipeline-mode != 'dast-only' && inputs.skip-sast != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: sast-report
        path: ${{ inputs.sast-report-dir }}/
        if-no-files-found: warn
        retention-days: 30

    - name: Upload sensitive data report artifact
      if: inputs.pipeline-mode != 'dast-only' && inputs.skip-sast != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: sensitive-data-report
        path: |
          ${{ inputs.sast-report-dir }}/sensitive-data.json
          ${{ inputs.sast-report-dir }}/sensitive-data.txt
        if-no-files-found: warn
        retention-days: 30

    - name: Prepare DAST target
      if: (inputs.pipeline-mode == 'dast-only' || (inputs.pipeline-mode == 'full' && inputs.skip-dast != 'true')) && inputs.dast-target != ''
      shell: bash
      env:
        DAST_TARGET: ${{ inputs.dast-target }}
        DAST_START_COMMAND: ${{ inputs.dast-start-command }}
        DAST_START_WAIT_SECONDS: ${{ inputs.dast-start-wait-seconds }}
        DAST_REPORT_DIR: ${{ inputs.dast-report-dir }}
      run: bash "${{ github.action_path }}/scripts/dast-prepare.sh"

    - name: OWASP ZAP DAST scan
      if: (inputs.pipeline-mode == 'dast-only' || (inputs.pipeline-mode == 'full' && inputs.skip-dast != 'true')) && inputs.dast-target != ''
      uses: zaproxy/action-baseline@v0.14.0
      with:
        target: ${{ env.DAST_TARGET }}
        fail_action: ${{ inputs.dast-fail-on-findings }}
        cmd_options: ${{ inputs.dast-fail-on-findings == 'true' && '' || '-I' }}
        allow_issue_writing: false
        artifact_name: dast-zap-report

    - name: Collect DAST reports
      if: always() && (inputs.pipeline-mode == 'dast-only' || (inputs.pipeline-mode == 'full' && inputs.skip-dast != 'true')) && inputs.dast-target != ''
      shell: bash
      env:
        DAST_REPORT_DIR: ${{ inputs.dast-report-dir }}
        DAST_START_COMMAND: ${{ inputs.dast-start-command }}
      run: bash "${{ github.action_path }}/scripts/dast-collect.sh"

    - name: Publish DAST report to job summary
      if: always() && (inputs.pipeline-mode == 'dast-only' || (inputs.pipeline-mode == 'full' && inputs.skip-dast != 'true')) && inputs.dast-target != ''
      shell: bash
      env:
        DAST_REPORT_DIR: ${{ inputs.dast-report-dir }}
      run: bash "${{ github.action_path }}/scripts/dast-summary.sh"

    - name: Upload DAST report artifact
      if: always() && (inputs.pipeline-mode == 'dast-only' || (inputs.pipeline-mode == 'full' && inputs.skip-dast != 'true')) && inputs.dast-target != ''
      uses: actions/upload-artifact@v4
      with:
        name: dast-report
        path: ${{ inputs.dast-report-dir }}/
        if-no-files-found: warn
        retention-days: 30
